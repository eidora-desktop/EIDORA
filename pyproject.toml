[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eidora-desktop"
dynamic = ["version"]
description = "Clean PySide desktop application for EIDORA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av==16.1.0",
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "numpy>=1.26",
  "onnx>=1.22.0; sys_platform == 'darwin'",
  "onnxruntime>=1.20; sys_platform != 'win32' and sys_platform != 'linux' or platform_machine != 'AMD64' and platform_machine != 'x86_64'",
  # CUDA 12 and cuDNN 9.10 retain Pascal support (including GeForce MX350).
  # ORT 1.27+ PyPI GPU wheels use CUDA 13; do not upgrade these independently.
  "onnxruntime-gpu[cuda,cudnn]==1.26.0; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-cudnn-cu12==9.10.2.21; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-cublas-cu12==12.8.4.1; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-cuda-runtime-cu12==12.8.90; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-cuda-nvrtc-cu12==12.8.93; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-cufft-cu12==11.3.3.83; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-curand-cu12==10.3.9.90; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "nvidia-nvjitlink-cu12==12.8.93; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
  "Pillow>=13.0.0",
  "PySide6==6.10.1; sys_platform == 'win32'",
  "PySide6==6.11.2; sys_platform == 'darwin'",
  "PySide6==6.11.1; sys_platform != 'win32' and sys_platform != 'darwin'",
  "huggingface_hub>=0.23",
  "matplotlib>=3.11",
  "h5py>=3.11",
  "ijson>=3.3",
  "lxml>=5",
  "odfpy>=1.4",
  "openpyxl>=3.1",
  "pacmap==0.9.1",
  "pyarrow>=16",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "tokenizers>=0.19",
  "trimap==1.1.5",
  "PyYAML>=6",
  "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
eidora-desktop = "app:main"

[tool.setuptools]
py-modules = ["app", "eidora_version"]

[tool.setuptools.dynamic]
version = {attr = "eidora_version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared = ["resources/video-audit/*.mkv"]
project = ["resources/*.json"]
MainWindow = ["tour_text.toml"]
DiscoveryArea = ["palettes.json", "palettes.LICENSE.txt"]
"*" = ["**/*.qrc", "**/*.svg", "**/*.png", "**/*.ico", "**/*.ui", "**/*.yaml", "**/*.onnx", "**/*.qml", "**/*.qsb", "**/qmldir", "**/*.so", "**/*.dylib", "**/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests", "automation/tests"]
pythonpath = ["src"]
