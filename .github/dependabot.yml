version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Runtime upgrades need coordinated platform pins and application validation.
    # Zero disables version PRs only; security PRs remain enabled in repo settings.
    open-pull-requests-limit: 0
