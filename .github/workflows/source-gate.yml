name: Source gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-checkout:
    name: Validate public checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/runtime-requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          # Use the same native runtime dependencies as the packaged Linux build.
          xargs -a packaging/linux/apt-packages.txt sudo apt-get install --yes --no-install-recommends

      - name: Install runtime dependencies
        run: |
          python -m pip install --only-binary=numba,llvmlite -r packaging/runtime-requirements.txt
          python -m pip check
          python automation/check_qt_runtime.py

      - name: Validate tracked source and resources
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/eidora-pycache
        run: |
          python automation/source_gate.py
          python automation/resource_inventory.py

      - name: Compile application and automation
        run: python -m compileall -q src automation
